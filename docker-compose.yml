version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: home-inventory-postgres
    environment:
      POSTGRES_DB: homedb
      POSTGRES_USER: sa
      POSTGRES_PASSWORD: mycat123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./home-inventory-management/src/main/resources/schema-postgresql.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - home-inventory-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sa -d homedb"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: home-inventory-app
    environment:
      SPRING_PROFILES_ACTIVE: develop
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/homedb
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: mycat123
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - home-inventory-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  home-inventory-network:
    driver: bridge
