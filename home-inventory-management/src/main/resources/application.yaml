spring:
  profiles:
    active: local
  jpa:
    show-sql: true
  output:
    ansi:
      enabled: always

logging:
  level:
    org:
      hibernate:
        SQL: DEBUG  # 실행된 SQL 쿼리 로그
        type:
          descriptor:
            sql:
              BasicBinder: TRACE  # 쿼리에 바인딩되는 파라미터 로그

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:~/homedb;mode=mysql
    username: sa
    password:
    driverClassName: org.h2.Driver
  h2:
    console:
      enabled: true
  sql:
    init:
      mode: always

---
spring:
  config:
    activate:
      on-profile: develop
  sql:
    init:
      platform: postgresql
      schema-locations: classpath*:schema-postgresql.sql
  datasource:
    url: jdbc:postgresql://localhost:5432/homedb
    username: sa
    password: mycat123
    driverClassName: org.postgresql.Driver
  jpa:
    defer-datasource-initialization: true