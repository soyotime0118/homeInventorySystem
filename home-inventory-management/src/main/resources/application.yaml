spring:
  profiles:
    active: local
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: never
---
spring:
  config:
    activate:
      on-profile: local
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
  datasource:
    url: jdbc:h2:~/homedb;mode=mysql
    username: sa
    password:
    driverClassName: org.h2.Driver
  h2:
    console:
      enabled: true
  sql:
    init:
      mode: always

---
spring:
  config:
    activate:
      on-profile: develop
  datasource:
    url: jdbc:postgresql://localhost:5432/homedb
    username: sa
    password: mycat123
    driverClassName: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
